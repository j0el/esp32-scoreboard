<text x="250" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2c2c2a">ESP32-C3</text>
<text x="250" y="138" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5f5e5a">SuperMini board</text>

