<svg width="680" height="650" viewBox="0 0 680 650" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ESP32-C3 to ST7789 display wiring</title>
<desc>Physical pin layout showing which ESP32-C3 pins solder to which display pins</desc>
<rect x="0" y="0" width="680" height="650" fill="#ffffff"/>

<rect x="180" y="100" width="140" height="440" rx="12" fill="none" stroke="#5f5e5a" stroke-width="1"/>
