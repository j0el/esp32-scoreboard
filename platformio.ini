[platformio]
; `pio run` / `pio run -t upload` with no -e only touches the real app.
; Use `-e display_test` or `-e wifi_test` to build one of the smoke tests instead.
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; WiFi + TLS + TFT_eSPI is close to the 1.3 MB default app partition
board_build.partitions = huge_app.csv
build_src_filter = +<main.cpp>

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    ; USB serial on the C3's native USB port
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; TFT_eSPI configured here so the library needs no User_Setup edits
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_SCLK=4
    -DTFT_MOSI=6
    -DTFT_MISO=-1
    -DTFT_DC=5
    -DTFT_RST=7
    -DTFT_CS=-1
    -DTFT_BL=3
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DSPI_FREQUENCY=40000000

; Display-only smoke test: no WiFi, no config.h needed.
; pio run -e display_test -t upload -t monitor
[env:display_test]
extends = env:esp32c3
build_src_filter = +<display_test.cpp>

; WiFi-only smoke test: no display needed, but reads WIFI_SSID/WIFI_PASS from include/config.h.
; pio run -e wifi_test -t upload -t monitor
[env:wifi_test]
extends = env:esp32c3
build_src_filter = +<wifi_test.cpp>
